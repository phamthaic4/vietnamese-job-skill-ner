[project]
name = "vietnamese-job-skill-ner"
version = "1.0.0"
description = "PhoBERT fine-tuned for Vietnamese IT skill NER (BIO tagging)"
requires-python = ">=3.10"
license = { file = "LICENSE" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PIE"]
ignore = [
    "E501",   # line length is not enforced
    "B905",   # zip(strict=) left off: several call sites zip a padded sequence against a shorter one
    "SIM105", # try/except/pass is clearer than contextlib.suppress here
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs the model weights in model/best (download from the v1.0.0 release)",
]
filterwarnings = ["ignore::DeprecationWarning"]
